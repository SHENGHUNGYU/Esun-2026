[project]
name = "esun-research-agent"
version = "0.1.0"
description = "Point-in-time market snapshots and auditable research with LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "pandas>=2.2,<3", "pyarrow>=18", "httpx>=0.28,<1", "pydantic>=2.10,<3", "defusedxml>=0.7,<1", "duckdb>=1.2,<2", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
esun-research = "esun_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esun_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

